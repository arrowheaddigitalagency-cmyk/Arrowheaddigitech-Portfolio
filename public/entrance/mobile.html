let start=performance.now(),paused=false,freeze=0,mouse={x:-1000,y:-1000},demo=false,ready=false;
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const colors=['#087eff','#ff7824','#f3372e'];let seed=22;function rand(){seed=(seed*16807)%2147483647;return(seed-1)/2147483646}
const particles=Array.from({length:1200},(_,i)=>{let side=i%2?-1:1,u=rand(),spread=(rand()-.5)*(25+85*u),x=450+side*(142+u*290),y=600-250*u+Math.sin(u*8)*38+spread;return{x,y,bx:x,by:y,vx:0,vy:0,phase:rand()*6.28,size:.6+rand()*1.45,color:colors[i%3],alpha:.3+rand()*.65}});
function reset(){start=performance.now();for(const p of particles){p.x=p.bx+(rand()-.5)*450;p.y=p.by+(rand()-.5)*200;p.vx=p.vy=0}paused=false;root.querySelector('[data-pause]').textContent='Pause'}
root.querySelector('[data-replay]').onclick=reset;
root.querySelector('[data-pause]').onclick=()=>{paused=!paused;if(paused)freeze=performance.now();else start+=performance.now()-freeze;root.querySelector('[data-pause]').textContent=paused?'Play':'Pause'};
c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);const r=c.getBoundingClientRect();mouse={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}});c.addEventListener('pointerup',()=>mouse={x:-1000,y:-1000});c.addEventListener('pointercancel',()=>mouse={x:-1000,y:-1000});c.addEventListener('pointermove',e=>{const r=c.getBoundingClientRect();mouse={x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}});c.addEventListener('pointerleave',()=>mouse={x:-1000,y:-1000});
function draw(now){if(!ready||paused)return;let t=(now-start)/1000;ctx.fillStyle='#fafbfc';ctx.fillRect(0,0,W,H);
// Preserve the approved artwork and typography exactly.
ctx.globalAlpha=reduced?1:Math.min(1,t/1.6);ctx.drawImage(img,0,0,W,H);ctx.globalAlpha=1;
if(demo&&t>3){mouse={x:720+450*Math.sin((t-3)*1.2),y:280+90*Math.cos((t-3)*1.6)}}
const visible=reduced?1:Math.min(1,t/.6);
for(const p of particles){let tx=p.bx+(reduced?0:Math.sin(t*.8+p.phase)*7),ty=p.by+(reduced?0:Math.cos(t+p.phase)*9);let dx=p.x-mouse.x,dy=p.y-mouse.y,dist=Math.hypot(dx,dy);if(dist<150&&dist>.1){let force=(1-dist/150)*2.8;p.vx+=dx/dist*force;p.vy+=dy/dist*force}p.vx+=(tx-p.x)*.012;p.vy+=(ty-p.y)*.012;p.vx*=.9;p.vy*=.9;p.x+=p.vx;p.y+=p.vy;ctx.globalAlpha=p.alpha*visible;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,7);ctx.fill()}
ctx.globalAlpha=1;
// Traveling light nodes around the emblem.
for(let i=0;i<10;i++){let a=i*.58+(reduced?0:t*.09);let x=450+410*Math.cos(a),y=540+510*Math.sin(a);if(y>760)continue;let glow=ctx.createRadialGradient(x,y,0,x,y,13);glow.addColorStop(0,colors[i%3]);glow.addColorStop(1,'transparent');ctx.globalAlpha=.55*visible;ctx.fillStyle=glow;ctx.fillRect(x-13,y-13,26,26);ctx.fillStyle=colors[i%3];ctx.beginPath();ctx.arc(x,y,2.6,0,7);ctx.fill()}
ctx.globalAlpha=1;if(demo&&t>3){ctx.strokeStyle='rgba(12,44,74,.5)';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(mouse.x,mouse.y,17,0,7);ctx.stroke();ctx.fillStyle='#15324c';ctx.beginPath();ctx.arc(mouse.x,mouse.y,3,0,7);ctx.fill()}
}
function loop(now){draw(now);requestAnimationFrame(loop)}img.onload=()=>{ready=true;reset();requestAnimationFrame(loop)};
window.arrowheadPreview={startDemo(){demo=true;reset()},stopDemo(){demo=false;mouse={x:-1000,y:-1000}},get ready(){return ready},get displacement(){return particles.reduce((s,p)=>s+Math.hypot(p.x-p.bx,p.y-p.by),0)/particles.length}};
})();
